version: "3.8"

services:
  # PostgreSQL Relational Database Service
  postgres:
    image: postgres:15-alpine
    container_name: luxebeauty-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-luxebeauty}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: luxebeauty-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # LuxeBeauty Full-Stack Web Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxebeauty-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-luxebeauty}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-luxury_secret_production_key_2026}
      JWT_EXPIRE: 5d
      COOKIE_EXPIRE: 5
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

volumes:
  postgres_data:
  redis_data:
